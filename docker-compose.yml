services:
  api:
    build: .
    image: calibration-api:latest
    container_name: calibration-api
    ports:
      - "8000:8000"
    volumes:
      - calibration-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  calibration-data:
